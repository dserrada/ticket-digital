plugins {
    id 'application'
}

application {
    mainClass = 'org.terra.incognita.ticketdigital.mercadona.gmail.Main'
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.slf4j:slf4j-api:2.0.+'
    implementation 'com.google.api-client:google-api-client:2.8.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20260525-2.0.0'
    implementation 'ch.qos.logback:logback-classic:1.5.+', { transitive = true}
    testImplementation 'com.google.http-client:google-http-client-test:1.47.0'
}
